<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUGIC Arcade</title>
<link rel="stylesheet" href="common/arcade.css">
<style>
  .games { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; width: min(640px, 100%); margin-top: 10px; }
  .games a { display: block; background: var(--panel); border: 1px solid #2a3040; border-radius: 8px; padding: 16px; text-decoration: none; color: var(--fg); }
  .games a:hover { border-color: var(--acc); }
  .games h2 { margin: 0 0 6px; font-size: 18px; color: var(--acc); }
  .games p { margin: 0; color: var(--dim); }
</style>
</head>
<body>
<h1>MUGIC ARCADE</h1>
<div class="games">
  <a href="invaders/"><h2>Invaders</h2><p>Roll to steer the cannon, flick to fire.</p></a>
  <a href="sokoban/"><h2>倉庫番 Sōkoban</h2><p>Flick left/right/up/down to step and push crates, undo with a button.</p></a>
</div>
<p class="help">Needs a MUGIC in BLE output mode (firmware ≥ 2.2.0) and Chrome or Edge. Every game also plays with the keyboard.</p>
</body>
</html>
