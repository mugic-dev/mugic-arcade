<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUGIC Arcade High Scores</title>
<link rel="stylesheet" href="../common/arcade.css">
<style>
  .scores { width: min(520px, 100%); }
  .play { display: inline-block; margin: 0 0 10px; color: var(--acc); }
  .levels { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; width: min(1040px, 100%); }
  .levels .scores { width: auto; margin-top: 0; }
</style>
</head>
<body>
<a class="back" href="../">← arcade</a>
<h1 id="title">HIGH SCORES</h1>
<a class="play" id="play" href="../">▶ play</a>
<div id="content"></div>

<script src="../common/config.js"></script>
<script src="../common/scores.js"></script>
<script src="../common/games.js"></script>
<script>
const $ = id => document.getElementById(id);
const g = GAMES.find(x => x.id === new URLSearchParams(location.search).get('game')) || GAMES[0];
document.title = `MUGIC Arcade — ${g.name} high scores`;
$('title').textContent = `${g.short || g.name.toUpperCase()} — HIGH SCORES`;
$('play').href = `../${g.id}/`; $('play').textContent = `▶ play ${g.name}`;

// levelled games: top 10 (fewest moves, hard mode) per level; others: top 100
function render() {
  if (g.levels) {
    $('content').innerHTML = '<div class="levels">' + Array.from({ length: g.levels }, (_, i) =>
      `<div class="scores"><h3>LEVEL ${i + 1} — FEWEST MOVES</h3><div id="l${i + 1}"></div></div>`).join('') + '</div>';
    for (let l = 1; l <= g.levels; ++l)
      Scores.top(g.id, { mode: 'hard', level: l, lowerIsBetter: true, limit: 10 }).then(rows => Scores.render($('l' + l), rows, ' moves', { dates: true }));
  } else {
    $('content').innerHTML = `<div class="scores"><h3>${g.board === 'LONGEST STREAK' ? 'LONGEST STREAKS' : 'TOP 100'}</h3><div id="board"></div></div>`;
    Scores.top(g.id, { limit: 100 }).then(rows => Scores.render($('board'), rows, '', { dates: true }));
  }
}
render();
let newest;
Scores.latest().then(t => { newest = t; }).catch(() => {});
setInterval(async () => {
  if (document.hidden) return;
  const t = await Scores.latest().catch(() => newest);
  if (t !== newest) { newest = t; render(); }
}, 3000);
</script>
</body>
</html>
